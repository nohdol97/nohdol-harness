# Codex 프로젝트 설정 — 저장소와 훅 정의를 신뢰한 뒤 적용된다(ADR 031).
# AGENTS.md는 trust 전에도 기본 32KiB 안에 들어야 하며, 아래 64KiB는 전역 지침 결합 여유를 위한 2차 방어다.
project_doc_max_bytes = 65536

[features]
hooks = true

[[hooks.PostToolUse]]
matcher = "Bash|shell|local_shell"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "for p in python3 python py; do \"$p\" -c \"\" >/dev/null 2>&1 && exec \"$p\" \"$PWD/.agents/hooks/gate-reminder.py\" --record; done; exit 0"

[[hooks.PreToolUse]]
matcher = "Edit|Write|MultiEdit|NotebookEdit|apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "for p in python3 python py; do \"$p\" -c \"\" >/dev/null 2>&1 && exec \"$p\" \"$PWD/.agents/hooks/gate-reminder.py\" --check; done; exit 0"

# tier-gate — 서브에이전트 발행에 9절 티어 모델 지정 강제. Codex의 발행 도구
# 이름은 실측하지 않았으므로 Claude 실측 이름(Agent/Task)과 spawn_agent를 함께
# 건다. 매처가 어긋나면 발화하지 않을 뿐 차단은 생기지 않는다(fail-open, ADR 029).
[[hooks.PreToolUse]]
matcher = "Agent|Task|spawn_agent"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "f=\"$PWD/.agents/hooks/tier-gate.py\"; [ -r \"$f\" ] || exit 0; for p in python3 python py; do \"$p\" -c \"\" >/dev/null 2>&1 && exec \"$p\" \"$f\"; done; exit 0"

[[hooks.SessionStart]]
matcher = "startup|resume|clear"

[[hooks.SessionStart.hooks]]
type = "command"
command = "for p in python3 python py; do \"$p\" -c \"\" >/dev/null 2>&1 && exec \"$p\" \"$PWD/.agents/hooks/agentsview-daemon.py\"; done; exit 0"

[[hooks.SessionStart.hooks]]
type = "command"
command = "for p in python3 python py; do \"$p\" -c \"\" >/dev/null 2>&1 && exec \"$p\" \"$PWD/.agents/hooks/harness-review-reminder.py\"; done; exit 0"

[[hooks.SessionStart.hooks]]
type = "command"
command = "for p in python3 python py; do \"$p\" -c \"\" >/dev/null 2>&1 && exec \"$p\" \"$PWD/.agents/hooks/worklog-reminder.py\"; done; exit 0"
